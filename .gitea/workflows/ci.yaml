name: CI

# Runs on every push and pull request. Guards the git auto-update mechanism:
# the agent pulls new commits and self-restarts, so a broken commit reaching
# `main` would take the fleet down. This pipeline catches compile errors and
# logic regressions before that happens.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # runtime deps (imported at module load) + test runner
          pip install requests pyyaml pytest

      - name: Syntax / compile check
        run: python3 -m py_compile sentinel_agent.py sentinel_agent_init.py

      - name: Unit tests
        run: python3 -m pytest
